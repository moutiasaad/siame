name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  web:
    name: Application web (PHP 8.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Vérification de la syntaxe PHP
        run: find web -name "*.php" -print0 | xargs -0 -n1 php -l

  firmware:
    name: Firmware Arduino Uno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configuration d'exemple
        run: cp firmware/siame_gprs/config.example.h firmware/siame_gprs/config.h
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:avr:uno
          sketch-paths: firmware/siame_gprs
          libraries: |
            - name: DHT sensor library
            - name: Adafruit Unified Sensor

  simulator:
    name: Simulateur Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile simulator/simulate_device.py && python simulator/simulate_device.py backfill --hours 1 | head -3
